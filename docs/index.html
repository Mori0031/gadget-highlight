<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GADGET Highlight｜ガジェットセール・最安値情報</title><meta name="description" content="Amazon・楽天・公式ストアのガジェット値下げ、クーポン、観測最安値を事実データだけで掲載。"><style>
:root{--bg:#070706;--panel:#11110f;--line:#343029;--ink:#f2eee4;--muted:#989186;--gold:#d0a35c;--amber:#ffb24a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% -10%,#39220e 0,transparent 32%),var(--bg);color:var(--ink);font-family:Inter,"Noto Sans JP",sans-serif}button,input,select{font:inherit}.shell{max-width:1500px;margin:auto;padding:0 4vw}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:13px;letter-spacing:.34em;text-transform:uppercase}.brand b{color:var(--gold)}.status{font:10px monospace;color:var(--muted);letter-spacing:.12em}.hero{min-height:420px;display:grid;grid-template-columns:1.4fr .6fr;align-items:end;padding:70px 0;border-bottom:1px solid var(--line)}.kicker,.micro{font:10px monospace;letter-spacing:.22em;color:var(--gold)}h1{font-size:clamp(3.2rem,8vw,8rem);line-height:.88;letter-spacing:-.06em;margin:22px 0;font-weight:500}h1 span{color:var(--gold)}.hero aside{border-left:1px solid var(--line);padding:40px}.metric{font-size:3rem;margin:10px 0}.controls{display:grid;grid-template-columns:2fr 1fr 1fr;gap:1px;background:var(--line);margin:32px 0;border:1px solid var(--line)}.field{width:100%;border:0;background:#0d0d0b;color:var(--ink);padding:18px}.count{display:flex;justify-content:space-between;margin:50px 0 18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}.card{background:linear-gradient(145deg,#15130f,#0b0b0a 70%);min-height:620px;padding:32px;position:relative;display:flex;flex-direction:column}.card:hover{background:linear-gradient(145deg,#201a11,#0d0d0b 70%)}.visual{height:220px;margin:-32px -32px 28px;display:grid;place-items:center;overflow:hidden;border-bottom:1px solid var(--line);background:radial-gradient(circle at 50% 25%,#3b2a16,#0b0b0a 68%)}.visual img{width:100%;height:100%;object-fit:contain;padding:20px;filter:drop-shadow(0 18px 25px #000)}.visual-empty{font:10px monospace;letter-spacing:.2em;color:#6f665b}.badges{display:flex;gap:8px;min-height:26px}.badge{border:1px solid var(--gold);color:var(--gold);font:10px monospace;letter-spacing:.13em;padding:6px 9px}.badge.low{background:var(--gold);color:#090806}.product{font-size:clamp(1.5rem,3vw,2.5rem);line-height:1.2;margin:28px 0 12px;font-weight:500}.merchant{font:11px monospace;color:var(--muted)}.pricing{display:flex;align-items:end;gap:18px;margin:25px 0}.off{color:var(--amber);font-size:2.5rem;font-weight:700}.prices del{display:block;color:var(--muted);font-size:13px}.sale{font-size:1.8rem;font-weight:700}.specs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:28px}.spec{border:1px solid var(--line);padding:7px 9px;color:#bbb4a9;font:11px monospace}.actions{display:flex;gap:10px;margin-top:auto}.buy,.coupon{border:0;padding:15px 18px;font-size:12px;font-weight:700;cursor:pointer}.buy{background:var(--gold);color:#080705;text-decoration:none;flex:1;text-align:center}.coupon{background:transparent;border:1px solid var(--line);color:var(--ink)}footer{border-top:1px solid var(--line);margin-top:80px;padding:35px 0 70px;color:var(--muted);font-size:11px;line-height:1.8}.demo{background:#4a2100;color:#ffd89e;padding:10px;text-align:center;font:11px monospace}@media(max-width:800px){.hero{grid-template-columns:1fr}.hero aside{border-left:0;border-top:1px solid var(--line);padding:25px 0}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.card{min-height:560px}}
</style><style>
.top{min-height:92px;gap:24px}.brand{font-size:clamp(1.15rem,2.2vw,1.8rem);font-weight:650;letter-spacing:.27em;white-space:nowrap}.controls{margin-top:24px;margin-bottom:0}.count{margin-top:30px;margin-bottom:18px}
@media(max-width:800px){.top{min-height:78px}.brand{font-size:1.05rem;letter-spacing:.2em}.top .status{display:none}.controls{margin-top:16px}.count{margin-top:26px}}
</style></head><body><div id="demo" class="demo" hidden>デモ表示 — API認証情報を設定するまで、価格と商品は画面確認用です。</div><div class="shell"><header class="top"><div class="brand">GADGET <b>Highlight</b></div><div class="status">Amazon・楽天市場・公式ストアの価格情報</div></header><section class="controls" aria-label="セールの検索条件"><input class="field" id="query" type="search" aria-label="キーワード検索" placeholder="商品名・ブランド・スペックで検索"><select class="field" id="category" aria-label="カテゴリ"><option value="">すべてのカテゴリ</option><option value="keyboard">メカニカルキーボード</option><option value="power">ポータブル電源・バッテリー</option><option value="pc">PC・周辺機器</option><option value="audio">オーディオ</option><option value="smart-home">スマートホーム</option><option value="diy">DIY・電子工作</option><option value="saas">SaaS・AIツール</option></select><select class="field" id="sort" aria-label="並び順"><option value="discount">割引率が高い順</option><option value="price">価格が安い順</option><option value="low">観測最安値を優先</option></select></section><div class="count"><span class="micro">表示中のセール</span><span id="count">0</span></div><main id="grid" class="grid"></main><footer><nav style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:18px"><a href="about/">運営者情報</a><a href="privacy/">プライバシー</a><a href="disclosure/">広告・アフィリエイト表記</a><a href="editorial-policy/">編集方針</a><a href="disclaimer/">免責事項</a><a href="contact/">お問い合わせ</a></nav>価格・在庫・クーポンは変動します。購入前に販売ページで最新条件をご確認ください。リンクにはアフィリエイトリンクを含む場合があります。観測最安値はGADGET Highlightが記録した期間内の価格です。</footer></div><script id="data" type="application/json">[{"id":"demo-keyboard","product_name":"75%アルミニウム メカニカルキーボード","category":"keyboard","brand":"Example Works","original_price":24000,"sale_price":16800,"key_specs":["75%レイアウト","ホットスワップ","2.4GHz / Bluetooth / USB-C","アルミケース"],"coupon_code":"GEAR30","coupon_expires_at":"2026-08-15","merchant":"Amazon","affiliate_url":"https://www.amazon.co.jp/","image_url":"","source_url":"https://www.amazon.co.jp/","verified_at":"2026-07-30","is_demo":true,"previous_low":16800,"is_all_time_low":false,"discount_rate":30},{"id":"demo-power","product_name":"ポータブル電源 1000Whモデル","category":"power","brand":"Example Energy","original_price":139800,"sale_price":97860,"key_specs":["容量1024Wh","定格1500W","リン酸鉄リチウム","急速充電対応"],"coupon_code":"","coupon_expires_at":"","merchant":"楽天市場","affiliate_url":"https://www.rakuten.co.jp/","image_url":"","source_url":"https://www.rakuten.co.jp/","verified_at":"2026-07-30","is_demo":true,"previous_low":97860,"is_all_time_low":false,"discount_rate":30},{"id":"demo-dac","product_name":"デスクトップUSB DAC／ヘッドホンアンプ","category":"audio","brand":"Example Audio","original_price":49800,"sale_price":39840,"key_specs":["USB DAC","PCM 768kHz","バランス出力","Bluetooth 5.1"],"coupon_code":"AUDIO20","coupon_expires_at":"2026-08-05","merchant":"公式ストア","affiliate_url":"#","image_url":"","source_url":"#","verified_at":"2026-07-30","is_demo":true,"previous_low":39840,"is_all_time_low":false,"discount_rate":20},{"id":"demo-hub","product_name":"Thunderbolt 4 ドック 14-in-1","category":"pc","brand":"Example Lab","original_price":45900,"sale_price":36720,"key_specs":["Thunderbolt 4","最大100W給電","8K出力","2.5GbE"],"coupon_code":"","coupon_expires_at":"","merchant":"Amazon","affiliate_url":"https://www.amazon.co.jp/","image_url":"","source_url":"https://www.amazon.co.jp/","verified_at":"2026-07-30","is_demo":true,"previous_low":36720,"is_all_time_low":false,"discount_rate":20}]</script><script>
const deals=JSON.parse(document.getElementById('data').textContent),q=document.getElementById('query'),cat=document.getElementById('category'),sort=document.getElementById('sort'),grid=document.getElementById('grid');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function yen(n){return new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n)}async function copyCode(value){if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(value);return}const area=document.createElement('textarea');area.value=value;document.body.append(area);area.select();document.execCommand('copy');area.remove()}function render(){let rows=deals.filter(d=>(!cat.value||d.category===cat.value)&&[d.product_name,d.brand,...(d.key_specs||[])].join(' ').toLowerCase().includes(q.value.trim().toLowerCase()));if(sort.value==='price')rows.sort((a,b)=>a.sale_price-b.sale_price);else if(sort.value==='low')rows.sort((a,b)=>Number(b.is_all_time_low)-Number(a.is_all_time_low));else rows.sort((a,b)=>b.discount_rate-a.discount_rate);document.getElementById('count').textContent=rows.length;document.getElementById('demo').hidden=!deals.some(d=>d.is_demo);grid.innerHTML=rows.map(d=>`<article class="card"><div class="visual">${d.image_url?`<img src="${esc(d.image_url)}" alt="${esc(d.product_name)}の商品画像" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'visual-empty',textContent:'画像を取得できませんでした'}))">`:'<span class="visual-empty">商品画像は販売元から取得します</span>'}</div><div class="badges"><span class="badge">${esc(d.merchant)}</span>${d.is_all_time_low?'<span class="badge low">観測最安値</span>':''}</div><h2 class="product">${esc(d.product_name)}</h2><div class="merchant">${esc(d.brand)} / 確認日 ${esc(d.verified_at)}</div><div class="pricing"><strong class="off">${d.discount_rate}% OFF</strong><div class="prices"><del>${yen(d.original_price)}</del><div class="sale">${yen(d.sale_price)}</div></div></div><div class="specs">${(d.key_specs||[]).map(x=>`<span class="spec">${esc(x)}</span>`).join('')}</div><div class="actions">${d.coupon_code?`<button class="coupon" data-code="${esc(d.coupon_code)}">コードをコピー ${esc(d.coupon_code)}</button>`:''}<a class="buy" href="${esc(d.affiliate_url)}" target="_blank" rel="nofollow sponsored noopener">セール価格で購入 →</a></div></article>`).join('');document.querySelectorAll('.coupon').forEach(b=>b.onclick=async()=>{await copyCode(b.dataset.code);b.textContent='コピーしました'})}[q,cat,sort].forEach(x=>x.addEventListener('input',render));render();
</script></body></html>
