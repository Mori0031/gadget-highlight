</style></head><body><header><a href="../">GADGET <b>Highlight</b></a></header><main><h1>編集・価格更新方針</h1><h2>取得元</h2><p>販売事業者の公式API、メーカー公式情報、確認済みの手動登録データを使用します。利用規約に反する商品ページの取得は行いません。</p><h2>事実データ</h2><p>商品名、通常価格、販売価格、割引率、主要仕様、クーポン、取得日時を掲載します。本文にない性能や評価を推測しません。</p><h2>更新</h2><p>原則として毎日2回更新します。API障害、在庫変動、販売元の仕様変更等により遅延または差異が生じる場合があります。</p><h2>訂正</h2><p>誤りは<a href="mailto:daichiprojectwork@gmail.com">メール</a>でご連絡ください。販売元の情報を確認して修正します。</p></main><footer>GADGET Highlight</footer></body></html>
