name: Manage Amazon deal

on:
  workflow_dispatch:
    inputs:
      asin:
        description: "対象商品のASIN（10文字）"
        required: true
      status:
        description: "active=再掲載 / inactive=非公開"
        required: true
        type: choice
        options:
          - inactive
          - active
      reason:
        description: "非公開理由（例: sale_ended / out_of_stock）"
        required: false
        default: "sale_ended"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Update listing status
        env:
          DEAL_ASIN: ${{ inputs.asin }}
          DEAL_STATUS: ${{ inputs.status }}
          DEAL_REASON: ${{ inputs.reason }}
        run: python deal_status.py --asin "$DEAL_ASIN" --status "$DEAL_STATUS" --reason "$DEAL_REASON"
      - name: Rebuild site
        run: |
          python collector.py --no-demo
          python builder.py
      - name: Publish update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "content: update Amazon deal status"
          git push
